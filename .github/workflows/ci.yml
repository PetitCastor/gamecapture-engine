name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test private engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore OcrxEngine.slnx
      - run: dotnet build OcrxEngine.slnx --no-restore -c Release
      - run: dotnet build benchmarks/Ocrx.Engine.Benchmarks/Ocrx.Engine.Benchmarks.csproj --no-restore -c Release
      - run: dotnet test OcrxEngine.slnx --no-build -c Release --verbosity normal

  identity-guard:
    name: Public identity guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject stale product identity
        shell: bash
        run: |
          matches=$(grep -RInE '[G]ameCapture|[g]amecapture' . \
            --exclude-dir=.git \
            --exclude='LegacyMigration.cs' \
            --exclude='LegacyMigrationTests.cs' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo '::error::Stale v1 identity found outside intentional migration code.'
            exit 1
          fi

      - name: Restore repository tools
        run: dotnet tool restore

      - name: Slopwatch
        run: dotnet slopwatch analyze -d .
