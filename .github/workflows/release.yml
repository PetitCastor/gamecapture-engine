name: Release engine

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semver to publish
        required: true
        default: 2.0.0

concurrency:
  group: release-engine
  cancel-in-progress: false

jobs:
  release:
    name: Publish Windows beta
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release access and version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.OCRX_RELEASES_TOKEN }}
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Expected stable semver, got '$version'." }
          if (-not $env:GH_TOKEN) { throw 'OCRX_RELEASES_TOKEN is required to publish the public binary feed.' }
          gh api repos/PetitCastor/ocrx-releases --silent
          if (git tag --list "v$version") { throw "Private engine tag v$version already exists." }
          gh release view "v$version" --repo PetitCastor/ocrx-releases *> $null
          if ($LASTEXITCODE -eq 0) { throw "Public release v$version already exists." }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: dotnet tool restore
      - run: dotnet restore OcrxEngine.slnx
      - run: dotnet build OcrxEngine.slnx --no-restore -c Release "-p:MinVerVersionOverride=$env:RELEASE_VERSION"
      - run: dotnet test OcrxEngine.slnx --no-build -c Release --verbosity normal
      - name: Publish engine
        run: dotnet publish src/Ocrx.Engine/Ocrx.Engine.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "-p:MinVerVersionOverride=$env:RELEASE_VERSION" -o publish/engine
      - name: Create automation archive
        shell: pwsh
        run: |
          $exe = 'publish/engine/Ocrx.Engine.exe'
          if (-not (Test-Path $exe)) { throw "Missing $exe." }
          Compress-Archive -Path $exe -DestinationPath "Ocrx.Engine-$env:RELEASE_TAG-win-x64.zip"
      - name: Create Velopack installer and update feed
        shell: pwsh
        run: |
          dotnet vpk pack `
            --packId OcrxEngine `
            --packVersion $env:RELEASE_VERSION `
            --packDir publish/engine `
            --mainExe Ocrx.Engine.exe `
            --packTitle 'OCRX Engine' `
            --packAuthors PetitCastor `
            --icon assets/app.ico `
            --exclude '.*\.(pdb|xml)$' `
            --noPortable `
            --outputDir releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($path in @(
            'releases/OcrxEngine-win-Setup.exe',
            'releases/releases.win.json',
            "releases/OcrxEngine-$env:RELEASE_VERSION-full.nupkg"
          )) {
            if (-not (Test-Path $path)) { throw "Missing release artifact $path." }
          }
      - name: Write checksums
        shell: pwsh
        run: |
          $paths = @(
            "Ocrx.Engine-$env:RELEASE_TAG-win-x64.zip",
            'releases/OcrxEngine-win-Setup.exe',
            'releases/releases.win.json',
            "releases/OcrxEngine-$env:RELEASE_VERSION-full.nupkg"
          )
          $lines = foreach ($path in $paths) {
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))"
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Publish public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.OCRX_RELEASES_TOKEN }}
        run: |
          gh release create $env:RELEASE_TAG `
            --repo PetitCastor/ocrx-releases `
            --title "OCRX $env:RELEASE_TAG" `
            --notes "Free unsigned Windows beta. Verify SHA256SUMS.txt before bypassing SmartScreen." `
            "Ocrx.Engine-$env:RELEASE_TAG-win-x64.zip" `
            'releases/OcrxEngine-win-Setup.exe' `
            'releases/releases.win.json' `
            "releases/OcrxEngine-$env:RELEASE_VERSION-full.nupkg" `
            'SHA256SUMS.txt'
      - name: Tag private source
        shell: pwsh
        run: |
          git tag $env:RELEASE_TAG $env:GITHUB_SHA
          git push origin $env:RELEASE_TAG
