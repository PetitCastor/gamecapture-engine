<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameCapture</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">

  <header class="header">
    <div class="header-top">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 256 256" width="28" height="28" aria-hidden="true">
          <defs>
            <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0f172a"/>
              <stop offset="100%" stop-color="#1e293b"/>
            </linearGradient>
            <linearGradient id="logoAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#818cf8"/>
            </linearGradient>
          </defs>
          <rect width="256" height="256" rx="56" fill="url(#logoBgGrad)"/>
          <g stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path d="M 48,80 V 56 H 80"/>
            <path d="M 176,56 H 208 V 80"/>
            <path d="M 48,176 V 200 H 80"/>
            <path d="M 176,200 H 208 V 176"/>
          </g>
          <path d="M 64,128 C 90,88 166,88 192,128 C 166,168 90,168 64,128 Z"
                fill="none" stroke="url(#logoAccentGrad)" stroke-width="14" stroke-linejoin="round"/>
          <circle cx="128" cy="128" r="26" fill="#38bdf8"/>
          <circle cx="192" cy="192" r="12" fill="#818cf8"/>
        </svg>
        <span class="brand-name">GameCapture</span>
        <span class="status-pill" id="status-pill">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <span id="status-label">—</span>
        </span>
      </div>

      <div class="header-right">
        <div class="theme-toggle" id="theme-toggle" role="group" aria-label="Theme">
          <button type="button" data-theme-choice="system" aria-pressed="true" title="Use system theme" aria-label="System theme">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="12" rx="1.5"/>
              <path d="M8 20h8M12 16v4"/>
            </svg>
          </button>
          <button type="button" data-theme-choice="light" aria-pressed="false" title="Light theme" aria-label="Light theme">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
          </button>
          <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark theme" aria-label="Dark theme">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/>
            </svg>
          </button>
        </div>
        <span class="app-version" id="app-version"></span>
      </div>
    </div>
  </header>

  <main class="body">

    <section class="col col-plugins" aria-label="Plugins">
      <div class="section-label">Plugins</div>

      <ul class="plugin-list" id="plugin-list"></ul>

      <label class="checkbox-row">
        <input type="checkbox" id="preview-builds">
        Include preview builds (may be unstable)
      </label>
      <p class="catalog-note is-error" id="preview-error" hidden></p>
      <p class="catalog-note">Plugins are downloaded from github.com/PetitCastor/gamecapture-plugins</p>
    </section>

    <section class="col col-settings" aria-label="Settings">
      <div class="settings-scroll">
        <div class="section-label">Settings</div>

        <div class="field">
          <label for="set-monitor">Capture monitor</label>
          <select class="control" id="set-monitor"></select>
        </div>

        <div class="field">
          <label for="set-ocr">OCR language</label>
          <select class="control" id="set-ocr"></select>
        </div>

        <div class="field">
          <label for="set-interval">Scan interval</label>
          <div class="suffix-group">
            <input class="control" id="set-interval" type="number" min="100" max="60000" style="border:none;">
            <span class="suffix">ms</span>
          </div>
        </div>

        <div class="field">
          <label for="set-hotkey">Hotkey</label>
          <input class="control mono-value" id="set-hotkey" type="text">
        </div>

        <div class="field">
          <label for="set-outdir">Output directory</label>
          <div class="field-row">
            <input class="control mono-value" id="set-outdir" type="text">
            <button type="button" class="btn" id="browse-outdir">Browse…</button>
          </div>
        </div>
      </div>

      <div class="settings-footer">
        <div class="warning-row">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3 2 20h20L12 3Z"/>
            <path d="M12 10v4M12 17h.01"/>
          </svg>
          <span>Applying restarts the engine and stops running plugins.</span>
        </div>
        <button type="button" class="btn btn-primary btn-block" id="apply-restart" disabled>Apply &amp; Restart</button>
        <p class="settings-status" id="settings-status" hidden></p>
      </div>
    </section>

  </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
